repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy and import-linter need the project's venv (installed deps, contracts),
  # so they run as local hooks against .venv rather than isolated environments.
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter contracts
        entry: .venv/bin/lint-imports
        language: system
        types: [python]
        pass_filenames: false
