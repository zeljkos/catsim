# Canonical noise from arXiv:2604.19481 (see CLAUDE.md "Canonical parameters").
name: paper-baseline
two_qubit_gate_error: 1.0e-4    # paper: two-qubit gate error
single_qubit_gate_error: 1.0e-5 # paper: single-qubit gate error
measurement_error: 1.0e-4       # ASSUMPTION: taken equal to the 2q gate error;
                                # the paper table gives no explicit SPAM number.
reset_error: 1.0e-4             # ASSUMPTION: taken equal to measurement error.
ion_loss_probability: 1.0e-7    # paper: ion loss probability
